name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5
          cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest --force

      - name: Diagnose test failures
        if: failure()
        shell: bash
        run: |
          opam exec -- dune --version
          opam exec -- dune build
          for t in dashboard bootstrap install proc update; do
            echo "== test_$t =="
            opam exec -- dune exec test/test_$t.exe && echo PASS || echo "FAIL exit=$?"
          done

      - name: Upload windows exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devkit-windows
          path: _build/default/bin/main.exe

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5

      - name: Check formatting
        run: |
          opam install ocamlformat.0.29.0 -y
          opam exec -- sh -c 'ocamlformat --check $(find lib test bin -name "*.ml" -o -name "*.mli")'
