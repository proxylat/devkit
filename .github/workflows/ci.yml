name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5
          dune-cache: true

      # Release notty caps ocaml < 5.4; master builds on 5.5 with one
      # extra record field (ci/notty-ocaml55.patch). Upstream has no
      # Windows backend, so ci/notty-winsize-windows.c (Win32 console
      # fallback, upstream code untouched in #else) is copied over
      # src-unix/native/winsize.c to keep notty.unix compiling on
      # mingw. CI never runs the TUI on Windows (plain-text fallback
      # in bin/main.ml); both shims die with notty in Phase B.
      - name: Pin patched notty
        run: |
          git clone --depth 50 https://github.com/pqwy/notty.git notty-upstream
          git -C notty-upstream apply ../ci/notty-ocaml55.patch
          cp ci/notty-winsize-windows.c notty-upstream/src-unix/native/winsize.c
          opam pin add notty ./notty-upstream -yn

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest --force

      - name: Upload windows exe
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: devkit-windows
          path: _build/default/bin/main.exe

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.5

      - name: Check formatting
        run: |
          opam install ocamlformat.0.29.0 -y
          opam exec -- sh -c 'ocamlformat --check $(find lib test bin -name "*.ml" -o -name "*.mli")'
